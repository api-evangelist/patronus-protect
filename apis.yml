name: Patronus Protect
aid: patronus-protect
description: >-
  Patronus Protect, from Casdo Labs GmbH, is an on-device AI firewall that detects prompt injection,
  PII/DLP, sensitive documents and agentic tool risk in text, public HTTPS webpages, documents and MCP
  servers before they are used by AI agents, RAG pipelines or LLM applications. It exposes a REST Scan
  API (control.patronus.studio/api/v1), first-party Rust, TypeScript and Python SDK clients, a local
  CLI with Codex, Claude Code and DeepSeek plugins, a remote OAuth-protected MCP server and a local
  stdio MCP server, and the open-source Patronus Ark scanning core.
url: https://patronus.studio/
created: '2026-09-20'
modified: '2026-09-20'
tags:
