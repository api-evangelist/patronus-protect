apis:
- name: Patronus Scan API
  description: >-
    Public REST Scan API (OpenAPI 3.1, contract v1.2.0). POST /api/v1/scan submits text, a public
    HTTPS URL, an MCP server, or uploaded documents for prompt-injection, PII/DLP, sensitive-document
    and agentic-tool-risk detection; GET /api/v1/scan/{job_id} polls the job. Bearer API key, with a
    rate-limited anonymous allowance for public-URL scans.
  humanURL: https://docs.patronus.studio/api-reference/
  baseURL: https://control.patronus.studio/api/v1
