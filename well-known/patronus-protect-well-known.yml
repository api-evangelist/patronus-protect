summary: >-
  Three real documents are served. patronus.studio serves an RFC 9116 security.txt (text/plain).
  The API control plane control.patronus.studio serves RFC 8414 OAuth authorization-server metadata
  and RFC 9728 OAuth protected-resource metadata (both application/json) for its remote MCP server
  (resource https://control.patronus.studio/api, scopes scan:read scan:write, DCR + PKCE S256).
  A scoped RFC 9728 doc is also served at /.well-known/oauth-protected-resource/api/mcp, which the
  MCP endpoint's 401 WWW-Authenticate challenge points to.
pointer_basis: >-
  WellKnown emitted on the three 200s (security.txt on patronus.studio; oauth-authorization-server +
  oauth-protected-resource on control.patronus.studio). SecurityTxt emitted on the served security.txt.
  protected_resource_metadata, dynamic_client_registration and delegated_identity are all present on
  the control host, the RFC 9728 resource server, not on the primary domain.
